services:
  - type: web
    name: cloudpulse-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && npx prisma generate && npm run build:api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cloudpulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"

databases:
  - name: cloudpulse-db
    plan: free
    databaseName: cloudpulse
    user: cloudpulse_admin
