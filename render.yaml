services:
  - type: web
    name: cloudpulse-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && npx prisma generate && npx prisma db push && npm run build:api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cloudpulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
      - key: REDIS_URL
        value: ""

databases:
  - name: cloudpulse-db
    plan: free
    databaseName: cloudpulse
    user: cloudpulse_admin
