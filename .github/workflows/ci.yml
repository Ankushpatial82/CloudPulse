name: CloudPulse Continuous Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up NodeJS Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Validate Prisma Database Schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudpulse_test

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Build Monorepo Bundles
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudpulse_test
          NEXT_PUBLIC_API_URL: http://localhost:5001/api
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5001

      - name: Verify Docker Build Compilation
        run: |
          docker build -t cloudpulse-api -f apps/api/Dockerfile .
          docker build -t cloudpulse-web -f apps/web/Dockerfile .
